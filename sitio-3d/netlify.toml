# Netlify: publicar esta carpeta tal cual, sin build.
[build]
  publish = "."

# Notas de la web anterior que todavía no están en este sitio: van al listado hasta que se migren.
[[redirects]]
  from = "/blog/equipo-estrategia"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/blog/equipo-estrategia.html"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/blog/el-album"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/blog/el-album.html"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/blog/emergencias-ihsa"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/blog/emergencias-ihsa.html"
  to = "/blog/"
  status = 301

# Las notas del blog de la web anterior (verticestudios.com/blog/<nota>) siguen funcionando.
# La nota se sirve desde su archivo .html sin cambiar la dirección que ve la persona.
[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug.html"
  status = 200

# El listado anterior de notas era /noticias.
[[redirects]]
  from = "/noticias"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/noticias/"
  to = "/blog/"
  status = 301
